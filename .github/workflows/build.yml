name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour publier la release sur un tag
  packages: read    # lecture de karoo-ext sur GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          # karoo-ext est sur GitHub Packages : l'authentification est obligatoire même en lecture.
          # Si GITHUB_TOKEN est refusé, crée un secret GPR_TOKEN (PAT classique, scope read:packages).
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GPR_TOKEN != '' && secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk karoo-stamina.apk

      - uses: actions/upload-artifact@v4
        with:
          name: karoo-stamina-apk
          path: karoo-stamina.apk

      - name: Publier la release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: karoo-stamina.apk
